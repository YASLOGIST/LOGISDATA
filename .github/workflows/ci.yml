name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: LOGISDATA

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: LOGISDATA/.nvmrc
          cache: npm
          cache-dependency-path: LOGISDATA/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests with coverage thresholds
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: LOGISDATA/coverage
          retention-days: 7

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: LOGISDATA/.nvmrc
          cache: npm
          cache-dependency-path: LOGISDATA/package-lock.json
      - run: npm ci
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Reject committed secrets
        working-directory: .
        run: |
          # Deliberately narrow: real key material, not the word "key".
          if git grep -nIE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]{10,})' -- . ':!*.lock' ':!package-lock.json'; then
            echo "::error::Potential secret material committed to the repository."
            exit 1
          fi
          echo "No secret patterns found."
      - name: Reject committed .env files
        working-directory: .
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::A .env file is tracked by git."
            exit 1
          fi
          echo "No tracked .env files."

  build:
    name: Production build and payload budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: LOGISDATA/.nvmrc
          cache: npm
          cache-dependency-path: LOGISDATA/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Start the production server
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/api/health > /dev/null; then
              echo "server ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not become healthy in 60s"; exit 1
      - name: Enforce the cover-screen payload budget
        run: npm run budget -- --url http://127.0.0.1:3100

  e2e:
    name: End-to-end, accessibility and performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: LOGISDATA/.nvmrc
          cache: npm
          cache-dependency-path: LOGISDATA/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright (functional + axe WCAG 2.1 AA + perf budget)
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: LOGISDATA/playwright-report
          retention-days: 7
